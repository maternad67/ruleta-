<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Maximo smyko - Tvorba týmů</title>
    <style>
        body {
            /* Tady je napojené tvé pozadí s lahvemi */
            background-image: url('vnitrekmaximo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Aby byl text čitelný přes to pestré pozadí, dáme mu poloprůhledný podklad */
        .container {
            background: rgba(11, 11, 26, 0.85);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(5px);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(138, 43, 226, 1);
            font-size: 36px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #e9d5ff;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        input[type="number"] {
            background: rgba(21, 21, 42, 0.9);
            color: white;
            border: 2px solid #8a2be2;
            border-radius: 8px;
            padding: 10px;
            font-size: 20px;
            width: 120px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Styly pro nová oddělená políčka na jména */
        #names-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .name-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .name-row input {
            background: rgba(21, 21, 42, 0.9);
            color: white;
            border: 2px solid #8a2be2;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 18px;
            width: 200px;
            outline: none;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
            line-height: 30px;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .add-btn {
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.5);
        }

        /* Hlavní tlačítka (Začít losovat / Zatočit) */
        .primary-btn {
            background: linear-gradient(90deg, #9400d3, #8a2be2);
            border: none;
            padding: 15px 50px;
            color: white;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .primary-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(138, 43, 226, 1);
        }

        .primary-btn:disabled {
            background: #4a4a4a;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #roulette-screen {
            display: none;
            margin-top: 10px;
        }

        .wheel-wrapper {
            position: relative;
            margin-bottom: 20px;
            display: inline-block;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(138, 43, 226, 0.6);
            border: 6px solid #2a2a4a;
            background: #000;
        }

        /* Obrázek koruny uprostřed rulety */
        #center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;  /* Velikost koruny - můžeš si upravit */
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            pointer-events: none; /* Aby neblokovala klikání */
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 45px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
        }

        #status-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e9d5ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #winner-text {
            height: 40px;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 15px #8a2be2, 0 0 30px #9400d3;
        }

        #teams-display {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .team-card {
            background: rgba(21, 21, 42, 0.9);
            border: 2px solid #9400d3;
            border-radius: 12px;
            padding: 15px 25px;
            min-width: 160px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .team-card h3 {
            margin: 0 0 12px 0;
            color: #e9d5ff;
            border-bottom: 2px solid #9400d3;
            padding-bottom: 8px;
            font-size: 20px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .team-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-card li {
            margin-bottom: 8px;
            font-size: 18px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Úvodní menu -->
    <div id="menu-screen" class="container">
        <h2>Maximo smyko - Tvorba týmů</h2>
        
        <div class="input-group">
            <label for="team-size">Počet hráčů v jednom týmu:</label>
            <input type="number" id="team-size" value="2" min="1">
        </div>

        <div class="input-group">
            <label>Jména hráčů:</label>
            <div id="names-list">
                <!-- Zde se generují políčka pomocí JS -->
            </div>
            <button class="add-btn" onclick="addNameField()">+ Přidat hráče</button>
        </div>
        
        <button class="primary-btn" onclick="startRoulette()">Začít losovat</button>
    </div>

    <!-- Obrazovka s ruletou -->
    <div id="roulette-screen" class="container">
        <div id="status-text">Točíme pro: Tým 1</div>
        <div id="winner-text"></div>
        
        <div class="wheel-wrapper" id="wheel-container">
            <div class="pointer"></div>
            <!-- TVOJE LOGO UPROSTŘED -->
            <img src="koruna.png" id="center-logo" alt="Maximo smyko">
            <canvas id="wheel" width="380" height="380"></canvas>
        </div>
        
        <br>
        <button class="primary-btn" id="spin-btn" onclick="spin()">Zatočit (Spin)</button>

        <!-- Zde se budou generovat týmy -->
        <div id="teams-display"></div>
    </div>

    <script>
        // Inicializace dynamických políček
        const initialNames = ["Hráč 1", "Hráč 2", "Hráč 3", "Hráč 4"];
        
        function addNameField(value = "") {
            const list = document.getElementById("names-list");
            const row = document.createElement("div");
            row.className = "name-row";
            
            const input = document.createElement("input");
            input.type = "text";
            input.value = value;
            input.placeholder = "Jméno hráče";
            
            const removeBtn = document.createElement("button");
            removeBtn.className = "remove-btn";
            removeBtn.innerText = "×";
            removeBtn.onclick = function() {
                list.removeChild(row);
            };
            
            row.appendChild(input);
            row.appendChild(removeBtn);
            list.appendChild(row);
        }

        // Naplnění počátečních políček
        initialNames.forEach(name => addNameField(name));


        // Logika rulety
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const radius = canvas.width / 2;
        
        let remainingNames = [];
        let teamSize = 2;
        let teams = [[]];
        let currentTeamIndex = 0;
        let currentAngle = 0;
        let isSpinning = false;
        
        // Barvy dílků
        const colors = ["#8a2be2", "#663399", "#9400d3", "#4b0082", "#9932cc", "#7b68ee"];

        function startRoulette() {
            // Posbíráme jména ze všech políček
            const inputs = document.querySelectorAll("#names-list input");
            remainingNames = Array.from(inputs).map(inp => inp.value.trim()).filter(n => n !== "");
            
            teamSize = parseInt(document.getElementById("team-size").value);
            
            if(remainingNames.length < 2) {
                alert("Zadej prosím alespoň 2 jména.");
                return;
            }
            if(teamSize < 1 || isNaN(teamSize)) {
                alert("Velikost týmu musí být alespoň 1.");
                return;
            }

            teams = [[]];
            currentTeamIndex = 0;
            currentAngle = 0;

            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("roulette-screen").style.display = "block";
            
            updateStatusText();
            renderTeamsUI();
            drawWheel();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (remainingNames.length === 0) return;

            const sliceAngle = (2 * Math.PI) / remainingNames.length;

            for (let i = 0; i < remainingNames.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#15152a";
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                // Zvětšený font v ruletě
                ctx.font = "bold 20px sans-serif";
                
                // Necháme uprostřed volné místo pro korunu (proto text končí dál od středu)
                if (remainingNames.length === 1) {
                    ctx.textAlign = "center";
                    ctx.fillText(remainingNames[i], 0, -radius/2);
                } else {
                    ctx.fillText(remainingNames[i], radius - 20, 7);
                }
                ctx.restore();
            }
            
            // Vykreslení tmavého kruhu uprostřed pod korunu (aby texty nezasahovaly pod ni)
            ctx.beginPath();
            ctx.arc(radius, radius, 55, 0, 2 * Math.PI);
            ctx.fillStyle = "#0b0b1a";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#8a2be2";
            ctx.stroke();
        }

        function spin() {
            if (isSpinning || remainingNames.length === 0) return;
            isSpinning = true;
            
            document.getElementById("winner-text").innerText = "Losování...";
            document.getElementById("spin-btn").disabled = true;

            const spinTimeTotal = Math.random() * 2000 + 3500; 
            const spinAngleStart = Math.random() * 10 + 20; 
            
            let spinTime = 0;

            function easeOut(t, b, c, d) {
                const ts = (t /= d) * t;
                const tc = ts * t;
                return b + c * (tc + -3 * ts + 3 * t);
            }

            function rotate() {
                spinTime += 30;
                if (spinTime >= spinTimeTotal) {
                    isSpinning = false;
                    processWinner();
                    return;
                }
                const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
                currentAngle += (spinAngle * Math.PI / 180);
                drawWheel();
                requestAnimationFrame(rotate);
            }
            rotate();
        }

        function processWinner() {
            let index = 0;
            if (remainingNames.length > 1) {
                const sliceAngle = (2 * Math.PI) / remainingNames.length;
                const degrees = (currentAngle % (2 * Math.PI));
                let winnerAngle = (3 * Math.PI / 2) - degrees;
                if (winnerAngle < 0) {
                    winnerAngle += 2 * Math.PI;
                }
                index = Math.floor(winnerAngle / sliceAngle);
            }

            const winner = remainingNames[index];
            document.getElementById("winner-text").innerText = winner + "!";

            teams[currentTeamIndex].push(winner);
            remainingNames.splice(index, 1);

            if (teams[currentTeamIndex].length >= teamSize && remainingNames.length > 0) {
                teams.push([]); 
                currentTeamIndex++; 
            }

            renderTeamsUI();
            updateStatusText();

            if (remainingNames.length > 0) {
                drawWheel();
                document.getElementById("spin-btn").disabled = false;
            } else {
                document.getElementById("wheel-container").style.display = "none";
                document.getElementById("status-text").innerText = "Rozlosování je kompletní!";
                document.getElementById("winner-text").innerText = "";
            }
        }

        function updateStatusText() {
            if (remainingNames.length > 0) {
                const currentTeamNumber = currentTeamIndex + 1;
                const currentMembers = teams[currentTeamIndex].length;
                document.getElementById("status-text").innerText = `Točíme pro: Tým ${currentTeamNumber} (${currentMembers}/${teamSize})`;
            }
        }

        function renderTeamsUI() {
            const container = document.getElementById("teams-display");
            container.innerHTML = ""; 

            teams.forEach((team, index) => {
                if (team.length === 0 && index !== 0) return;

                const card = document.createElement("div");
                card.className = "team-card";
                
                const title = document.createElement("h3");
                title.innerText = `Tým ${index + 1}`;
                card.appendChild(title);

                const list = document.createElement("ul");
                team.forEach(member => {
                    const li = document.createElement("li");
                    li.innerText = member;
                    list.appendChild(li);
                });
                
                card.appendChild(list);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
